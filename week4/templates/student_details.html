<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Data</title>
</head>
<body>
    <h1>Student Details</h1>
    <table border="2" id="student-details-table">
        <tr>
            <th>Student Id</th>
            <th>Course Id</th>
            <th>Marks</th>
        </tr>
        {% for row in records %}
        <tr>
            <td>{{ row.student_id }}</td>
            <td>{{ row.course_id }}</td>
            <td>{{ row.marks }}</td>
        </tr>
        {% endfor %}
        <tr>
            <td colspan="2" style="text-align: center"> Total Marks </td>
            <td>{{ total_marks }}</td>
        </tr>
    </table>
    <br/>
    <a href="/">Go Back</a>
</body>
</html>
